<!--
  TUMN News (tumnnews.com) — Newsletter signup capture
  ======================================================
  Self-contained snippet (HTML + CSS + JS). Shows a slide-up footer bar
  after 40% scroll OR 12 seconds on page, whichever comes first.
  Dismissible; won't re-show for 7 days once dismissed or once subscribed.

  Submissions go directly into Supabase project evtaizxntprnlitqxxyh,
  table public.newsletter_subscribers (id, email, source, created_at),
  via the project's public "publishable" key — safe to expose client-side,
  and the table's RLS policy ("public can subscribe") only allows INSERT.

  Rows land tagged source = 'tumnnews'.
-->
<style>
  #tumn-nl-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    transform: translateY(110%);
    transition: transform .4s ease;
    background: #0f1b33;
    color: #fff;
    padding: 14px 18px;
    z-index: 9999;
    box-shadow: 0 -2px 12px rgba(0,0,0,.25);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #tumn-nl-bar.tumn-nl-show { transform: translateY(0); }
  #tumn-nl-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  #tumn-nl-text { flex: 1 1 260px; font-size: 14.5px; line-height: 1.4; }
  #tumn-nl-text strong { color: #c9a227; }
  #tumn-nl-form { display: flex; gap: 8px; flex: 1 1 320px; }
  #tumn-nl-email {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
  }
  #tumn-nl-submit {
    background: #c9a227;
    color: #1a1a1a;
    border: none;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  #tumn-nl-submit:hover { background: #d9b542; }
  #tumn-nl-close {
    position: absolute;
    top: 6px; right: 10px;
    background: none;
    border: none;
    color: #aab2c0;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  #tumn-nl-close:hover { color: #fff; }
  #tumn-nl-msg { font-size: 13.5px; color: #9be29b; display: none; }
  @media (max-width: 480px) {
    #tumn-nl-form { flex-direction: column; }
    #tumn-nl-submit { width: 100%; }
  }
</style>

<div id="tumn-nl-bar" role="dialog" aria-label="Newsletter signup">
  <button id="tumn-nl-close" aria-label="Dismiss">&times;</button>
  <div id="tumn-nl-inner">
    <div id="tumn-nl-text">
      <strong>Stay in the loop.</strong> Get TUMN News updates in your inbox — no spam, unsubscribe any time.
    </div>
    <form id="tumn-nl-form">
      <input id="tumn-nl-email" type="email" required placeholder="you@email.com" autocomplete="email">
      <button id="tumn-nl-submit" type="submit">Subscribe</button>
    </form>
    <div id="tumn-nl-msg">Thanks — you're subscribed!</div>
  </div>
</div>

<script>
(function () {

    var until = localStorage.getItem(STORAGE_KEY);
    return until && Date.now() < parseInt(until, 10);
  }
  function hideForDays(days) {
    localStorage.setItem(STORAGE_KEY, String(Date.now() + days * 24 * 60 * 60 * 1000));
  }

  if (alreadyHandled()) return;

  var bar = document.getElementById("tumn-nl-bar");
  var shown = false;

  function showBar() {
    if (shown || alreadyHandled()) return;
    shown = true;
    bar.classList.add("tumn-nl-show");
  }

  var timer = setTimeout(showBar, 12000);

  // Trigger 2: 40% scroll depth
  function onScroll() {
    var scrolled = window.scrollY || window.pageYOffset;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    if (docHeight > 0 && scrolled / docHeight > 0.4) {
      showBar();
      window.removeEventListener("scroll", onScroll);
    }
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  document.getElementById("tumn-nl-close").addEventListener("click", function () {
    bar.classList.remove("tumn-nl-show");
    hideForDays(DAYS_TO_HIDE);
  });

    e.preventDefault();
    var emailInput = document.getElementById("tumn-nl-email");
    var email = emailInput.value.trim();
    if (!email) return;

    var submitBtn = document.getElementById("tumn-nl-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";

    fetch(SUPABASE_URL + "/rest/v1/newsletter_subscribers", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ email: email, source: SOURCE })
    })
      .then(function (res) {
        if (res.ok || res.status === 201) {
          document.getElementById("tumn-nl-form").style.display = "none";
          document.getElementById("tumn-nl-msg").style.display = "block";
          hideForDays(365);

          // unique constraint on email — already subscribed

          document.getElementById("tumn-nl-msg").textContent = "You're already on the list!";
          document.getElementById("tumn-nl-msg").style.display = "block";
          hideForDays(365);
        } else {
